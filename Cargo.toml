[workspace]
resolver = "2"
members = ["crates/walkit", "crates/walkit-trace", "crates/walkit-web"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/mattijsf/walkit"
rust-version = "1.85"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# the web build: smallest code, speed second
[profile.small]
inherits = "release"
opt-level = "z"
