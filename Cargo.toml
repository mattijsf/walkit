[workspace]
resolver = "2"
members = ["crates/walkit", "crates/walkit-android", "crates/walkit-trace", "crates/walkit-web"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/mattijsf/walkit"
rust-version = "1.85"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# a panic in the engine unwinds to the JNI boundary, where it is thrown as a Java exception a
# host reports as the skin's failure; an abort would end the host's process
panic = "unwind"
strip = true

# the web build: smallest code, speed second
[profile.small]
inherits = "release"
opt-level = "z"
