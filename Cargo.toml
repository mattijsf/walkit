[workspace]
resolver = "2"
members = ["crates/walkit", "crates/walkit-android", "crates/walkit-trace", "crates/walkit-web"]

[workspace.package]
version = "0.10.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/mattijsf/walkit"
rust-version = "1.85"

# the lints every crate takes (`[lints] workspace = true`): clippy's pedantic set, less the ones
# that fight an engine written in i32 layout pixels and bytes
[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_lossless = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
too_many_lines = "allow"
struct_excessive_bools = "allow"
many_single_char_names = "allow"
similar_names = "allow"
unreadable_literal = "allow"
map_unwrap_or = "allow"
redundant_closure_for_method_calls = "allow"
format_push_string = "allow"
format_collect = "allow"
match_same_arms = "allow"
float_cmp = "allow"
assert_is_empty = "allow"
naive_bytecount = "allow"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# a panic in the engine unwinds to the JNI boundary, where it is thrown as a Java exception a
# host reports as the skin's failure; an abort would end the host's process
panic = "unwind"
strip = true

# the web build: smallest code, speed second
[profile.small]
inherits = "release"
opt-level = "z"
