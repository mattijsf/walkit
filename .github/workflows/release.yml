name: Release

# On every push to main, release-please opens or updates a release pull request from the
# Conventional Commits since the last release: the next version in every file that carries it
# (release-please-config.json's extra-files) and CHANGELOG.md. Merging that pull request tags
# vX.Y.Z and makes the GitHub release; the job below then publishes the walkit crate.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release pull request
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  crate:
    name: Publish to crates.io
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # a crates.io API token with the publish-update scope for walkit; without it the job does nothing
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      CARGO_TERM_COLOR: always
    steps:
      - name: No CARGO_REGISTRY_TOKEN secret, so no publish
        if: env.CARGO_REGISTRY_TOKEN == ''
        run: echo "::notice::Add the CARGO_REGISTRY_TOKEN secret to publish walkit to crates.io, or run cargo publish -p walkit from the tag."
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: env.CARGO_REGISTRY_TOKEN != ''
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        if: env.CARGO_REGISTRY_TOKEN != ''
      - name: Publish
        if: env.CARGO_REGISTRY_TOKEN != ''
        run: cargo publish -p walkit --locked
