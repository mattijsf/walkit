[package]
name = "walkit-macos"
description = "The C interface the macOS example app calls: the walkit engine, its host and a software renderer"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

# its own workspace: the example builds on its own, outside the repository's crates
[workspace]

[lib]
crate-type = ["staticlib"]

[dependencies]
walkit = { path = "../../../crates/walkit", features = ["truetype"] }
image = { version = "0.25.10", default-features = false, features = ["png", "bmp", "gif", "jpeg"] }
zip = { version = "2.6.1", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
# a panic in the engine unwinds to the C boundary, where the app reports it as the skin's failure
panic = "unwind"
