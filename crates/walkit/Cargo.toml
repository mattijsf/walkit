[package]
name = "walkit"
description = "Modern Winamp skin engine: .wal skins, MAKI scripts, a draw list for any renderer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
homepage = "https://mattijsf.github.io/walkit/"
documentation = "https://docs.rs/walkit"
keywords = ["winamp", "skin", "maki", "wal", "wsz"]
categories = ["gui", "multimedia", "parser-implementations"]
# the crate is the engine's sources; the tests' fonts and skins stay in the repository
include = ["src/**/*.rs", "README.md", "LICENSE"]

[lib]
crate-type = ["rlib"]

[features]
# `truetype`: TrueType text drawn as Windows draws it, for hosts that draw their own letters
truetype = ["dep:skrifa"]

[dependencies]
skrifa = { version = "0.40", optional = true }

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
