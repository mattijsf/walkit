[package]
name = "walkit"
description = "Modern Winamp skin engine: .wal skins, MAKI scripts, a draw list for any renderer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["rlib"]

[features]
# `truetype`: TrueType text drawn as Windows draws it, for hosts that draw their own letters
truetype = ["dep:skrifa"]

[dependencies]
skrifa = { version = "0.40", optional = true }

[lints]
workspace = true
