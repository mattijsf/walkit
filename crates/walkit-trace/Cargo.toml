[package]
name = "walkit-trace"
description = "Runs the reference scenarios through walkit and writes each run's trace"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "walkit-trace"
path = "src/main.rs"

[dependencies]
walkit = { path = "../walkit" }
crc32fast = "1.5.4"
image = { version = "0.25.10", default-features = false, features = ["png", "bmp", "gif", "jpeg"] }
serde_json = "1.0.154"
zip = { version = "2.6.1", default-features = false, features = ["deflate"] }
