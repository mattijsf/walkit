[package]
name = "walkit-web"
description = "The engine for the web: a wasm module with a small C-style surface a JS host drives"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[features]
default = ["trace"]
# the reference scenarios recorded on the fixed trace host (`wk_record`), for the parity check
# and the measurements; a page that shows a skin does without
trace = ["dep:walkit-trace"]

[dependencies]
talc = { version = "4", default-features = false, features = ["lock_api"] }
walkit = { path = "../walkit" }
walkit-trace = { path = "../walkit-trace", default-features = false, optional = true }
